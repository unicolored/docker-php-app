# Custom nginx.conf for Dockerized PHP app - overrides Alpine default to avoid duplicates

user  www-data;  # Default, but can change to your MACHINE_USER if needed
worker_processes  auto;  # Auto-scale based on CPU cores
pid /run/nginx.pid;

events {
    worker_connections  1024;  # Tune for expected traffic
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;  # Container-friendly logging
    error_log   /dev/stderr error;

    sendfile        on;
    tcp_nopush     on;
    keepalive_timeout  65;

    # No default gzip here - let http.d/extend.conf handle it to avoid duplicates

    include /etc/nginx/http.d/*.conf;  # Sources your default.conf and extend.conf
}

; FROM unicolored/php-app (updated for Alpine, PHP 8.3, and stdout/stderr)

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
killasgroup=true
stopasgroup=true
autostart=true
autorestart=unexpected
exitcodes=0,2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize  ; Correct path for php:8.3-fpm-alpine
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
exitcodes=0

[program:cron]
command=/usr/sbin/crond -f  ; Alpine's BusyBox crond in foreground
autostart=true
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

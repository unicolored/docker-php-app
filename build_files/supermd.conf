[program:nginx]
command=nginx -g "daemon off;"
killasgroup=true
stopasgroup=true
autostart=true
autorestart=true
redirect_stderr=true

[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F
autostart=true
autorestart=unexpected
stdout_logfile=/var/www/html/var/log/supermd-php-fpm-stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/www/html/var/log/supermd-php-fpm-stderr.log
stderr_logfile_maxbytes=0
exitcodes=0

[program:cron]
autostart=true
autorestart=true
command=cron -f


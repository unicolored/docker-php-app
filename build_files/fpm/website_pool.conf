[website]
; https://www.digitalocean.com/community/tutorials/php-fpm-nginx
user = devops
group = devops
listen = /var/run/php-fpm-website-site.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660  ; Explicit for secure socket access

php_admin_value[disable_functions] = exec,passthru,shell_exec,system
php_admin_flag[allow_url_fopen] = off  ; Security: Off in FPM (overrides global if needed)

; Process manager: Dynamic for scaling in Kubernetes
pm = dynamic
pm.max_children = 10  ; Tuned lower for prod/start; adjust based on VPS resources (e.g., 75 for high traffic)
pm.start_servers = 5  ; Reduced for efficiency in containers
pm.min_spare_servers = 2
pm.max_spare_servers = 10
pm.process_idle_timeout = 10s

; Logging: Redirect to stderr for container stdout/stderr
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
php_value[slowlog] = /dev/stderr  ; Optional: Log slow requests
php_value[request_slowlog_timeout] = 10s  ; Tune as needed for debugging performance

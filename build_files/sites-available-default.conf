server {
    listen 80 default_server;
    listen [::]:80 default_server;  # Remove if IPv6 not needed

    server_name _;  # Catch-all;
    root /var/www/html/public;  # Adjust to /var/www/html for WordPress

    access_log /dev/stdout;  # Pipe to stdout for container logging
    error_log /dev/stderr error;  # Pipe to stderr for errors

    index index.html index.htm index.php;

    # Security: Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(env|git|svn|htaccess|yml|yaml|twig|md|lock|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static asset caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }


    # Main routing
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;  # Prevent arbitrary PHP execution
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm-website-site.sock;  # Or 127.0.0.1:9000 for TCP
        fastcgi_index index.php;
        include fastcgi_params;  # Use fastcgi_params if fastcgi.conf not present
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Custom error pages (optional)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
